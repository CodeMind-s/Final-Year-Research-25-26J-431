# docker-compose.yml
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: auth-service
    ports:
      - "50000:50000"
    environment:
      - GRPC_URL=0.0.0.0:50000
      - KAFKA_BROKER=kafka:9092
      - MONGO_URI=${MONGO_URI}
      - NOTIFY_LK_USER_ID=${NOTIFY_LK_USER_ID}
      - NOTIFY_LK_API_KEY=${NOTIFY_LK_API_KEY}
      - NOTIFY_LK_SENDER_ID=${NOTIFY_LK_SENDER_ID}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - app-network
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: user-service
    container_name: user-service
    ports:
      - "50053:50053"
    environment:
      - GRPC_URL=0.0.0.0:50053
      - KAFKA_BROKER=kafka:9092
      - MONGO_URI=${MONGO_URI}
    networks:
      - app-network
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  crystallization-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: crystallization-service
    container_name: crystallization-service
    ports:
      - "50054:50054"
    environment:
      - GRPC_URL=0.0.0.0:50054
      - KAFKA_BROKER=kafka:9092
      - MONGO_URI=${MONGO_URI}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - OPENWEATHER_LAT=${OPENWEATHER_LAT}
      - OPENWEATHER_LON=${OPENWEATHER_LON}
      - ONNX_SERVICE_GRPC_URL=crystallization-onnx-service:50055
    networks:
      - app-network
    depends_on:
      kafka:
        condition: service_healthy
      crystallization-onnx-service:
        condition: service_started
    restart: unless-stopped

  crystallization-onnx-service:
    build:
      context: .
      dockerfile: apps/crystallization-onnx-service/Dockerfile
    container_name: crystallization-onnx-service
    ports:
      - "50055:50055"
    environment:
      - GRPC_URL=0.0.0.0:50055
      - MONGO_URI=${MONGO_URI}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - OPENWEATHER_LAT=${OPENWEATHER_LAT}
      - OPENWEATHER_LON=${OPENWEATHER_LON}
      - KAFKA_BROKER=kafka:9092
    networks:
      - app-network
    volumes:
      - ./apps/crystallization-onnx-service/models:/app/models
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  audit-log-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: audit-log-service
    container_name: audit-log-service
    environment:
      - KAFKA_BROKER=kafka:9092
      - MONGO_URI=${MONGO_URI}
    networks:
      - app-network
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  email-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: email-service
    container_name: email-service
    environment:
      - KAFKA_BROKER=kafka:9092
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
    networks:
      - app-network
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  vision-service:
    build:
      context: .
      dockerfile: apps/vision-service/Dockerfile
    container_name: vision-service
    ports:
      - "50057:50057"
    environment:
      - GRPC_URL=0.0.0.0:50057
      - MONGO_URI=${MONGO_URI}
      - VISION_MODEL_PATH=/app/models/best.onnx
    networks:
      - app-network
    volumes:
      - ./apps/vision-service/models:/app/models
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment-service
    container_name: payment-service
    ports:
      - "50056:50056"
    environment:
      - GRPC_URL=0.0.0.0:50056
      - MONGO_URI=${MONGO_URI}
      - AUTH_SERVICE_URL=auth-service:50000
      - PAYHERE_MERCHANT_ID=${PAYHERE_MERCHANT_ID}
      - PAYHERE_MERCHANT_SECRET=${PAYHERE_MERCHANT_SECRET}
      - PAYHERE_SANDBOX=${PAYHERE_SANDBOX}
      - PAYHERE_NOTIFY_URL=${PAYHERE_NOTIFY_URL}
      - FRONTEND_URL=${FRONTEND_URL}
    networks:
      - app-network
    depends_on:
      auth-service:
        condition: service_started
    restart: unless-stopped

  compass-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: compass-service
    container_name: compass-service
    ports:
      - "50052:50052"
    environment:
      - GRPC_URL=0.0.0.0:50052
      - KAFKA_BROKER=kafka:9092
      - MONGO_URI=${MONGO_URI}
      - COMPASS_ML_SERVICE_URL=http://compass-ml-service:8002
    networks:
      - app-network
    depends_on:
      kafka:
        condition: service_healthy
      compass-ml-service:
        condition: service_started
    restart: unless-stopped

  waste-valorization-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: waste-valorization-service
    container_name: waste-valorization-service
    ports:
      - "50058:50058"
    environment:
      - GRPC_URL=0.0.0.0:50058
      - KAFKA_BROKER=kafka:9092
      - MONGO_URI=${MONGO_URI}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SQS_QUEUE_URL=${AWS_SQS_QUEUE_URL}
      - AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}
      - ENVIRONMENT=${ENVIRONMENT}
    networks:
      - app-network
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  gemini-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: gemini-service
    container_name: gemini-service
    ports:
      - "50059:50059"
    environment:
      - GRPC_URL=0.0.0.0:50059
      - CRYSTALLIZATION_SERVICE_URL=crystallization-service:50054
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - app-network
    depends_on:
      - crystallization-service
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    container_name: api-gateway
    ports:
      - "3400:3400"
    environment:
      - PORT=3400
      - JWT_SECRET=${JWT_SECRET}
      - KAFKA_BROKER=kafka:9092
      - AUTH_SERVICE_URL=auth-service:50000
      - USER_SERVICE_URL=user-service:50053
      - CRYSTALLIZATION_SERVICE_URL=crystallization-service:50054
      - VISION_SERVICE_URL=vision-service:50057
      - PAYMENT_SERVICE_URL=payment-service:50056
      - COMPASS_SERVICE_URL=compass-service:50052
      - WASTE_VALORIZATION_SERVICE_URL=waste-valorization-service:50058
      - AI_SERVICE_URL=gemini-service:50059
    networks:
      - app-network
    depends_on:
      - auth-service
      - user-service
      - crystallization-service
      - vision-service
      - payment-service
      - compass-service
      - waste-valorization-service
      - audit-log-service
      - gemini-service
      - email-service
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http api-gateway:3400
    ports:
      - "4040:4040"
    networks:
      - app-network
    depends_on:
      - api-gateway
    restart: unless-stopped

  compass-ml-service:
    build:
      context: .
      dockerfile: apps/compass-ml-service/Dockerfile
    container_name: compass-ml-service
    environment:
      - MODEL_DIR=/app/models
      - MONGO_URI=${MONGO_URI}
      - CRYSTALLIZATION_SERVICE_URL=crystallization-onnx-service:50055
    networks:
      - app-network
    volumes:
      - ./apps/compass-ml-service/models:/app/models:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/api/v1/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      crystallization-onnx-service:
        condition: service_started
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
syntax = "proto3";
package auth;
import "google/protobuf/timestamp.proto";

service AuthService {
  rpc SignIn(SignInRequest) returns (SignInResponse);
  rpc VerifyOtp(VerifyOtpRequest) returns (VerifyOtpResponse);
  rpc CompleteOnboarding(CompleteOnboardingRequest) returns (OnboardingResponse);
  rpc OAuthSignIn(OAuthSignInRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GetPersonalDetails(GetUserRequest) returns (UserResponse);
  // Subscription RPCs
  rpc CreateSubscription(CreateSubscriptionRequest) returns (CreateSubscriptionResponse);
  rpc GetSubscription(GetSubscriptionRequest) returns (GetSubscriptionResponse);
  rpc GetPlans(GetPlansRequest) returns (GetPlansResponse);
  rpc GetPlan(GetPlanRequest) returns (GetPlanResponse);
  rpc UpdateSubscription(UpdateSubscriptionRequest) returns (UpdateSubscriptionResponse);
  // Feature-based access check (replaces numeric CheckSubscriptionAccess)
  rpc CheckFeatureAccess(CheckFeatureAccessRequest) returns (CheckFeatureAccessResponse);
  // Admin Plan CRUD RPCs
  rpc CreatePlan(CreatePlanRequest) returns (CreatePlanResponse);
  rpc UpdatePlan(UpdatePlanRequest) returns (UpdatePlanResponse);
  rpc DeletePlan(DeletePlanRequest) returns (DeletePlanResponse);
  // PayHere payment RPCs
  rpc InitiatePayHereCheckout(PayHereCheckoutRequest) returns (PayHereCheckoutResponse);
  rpc HandlePayHereNotification(PayHereNotificationRequest) returns (PayHereNotificationResponse);
}

message SignInRequest {
  string email = 1;
  string phone = 2;
  string role = 3;
}

message SignInResponse {
  bool success = 1;
  string user = 2;
  string message = 3;
}

message VerifyOtpRequest {
  string email = 1;
  string phone = 2;
  string code = 3;
}

message VerifyOtpResponse {
  bool success = 1;
  string message = 2;
  string accessToken = 3;
  bool isNewUser = 4;
  bool isOnboarded = 5;
}

message CompleteOnboardingRequest {
  string userId = 1;
  string name = 2;
  string gender = 3;
  string preferredLanguage = 4;
  string preferredCurrency = 5;
}

message OnboardingResponse {
  bool success = 1;
  string message = 2;
  string id = 3;
  string email = 4;
  string phone = 5;
  string name = 6;
  string gender = 7;
  string preferredLanguage = 8;
  string preferredCurrency = 9;
  string role = 15;
  bool isOnboarded = 16;
}

message GetUserRequest {
  string userId = 1;
}

message UserResponse {
  string id = 1;
  string email = 2;
  string phone = 3;
  string role = 8;
  bool isOnboarded = 9;
  string plan = 17;
  bool is_subscribed = 18;
  bool isVerified = 20;
}

message OAuthSignInRequest {
  string email = 1;
  string name = 2;
  string providerId = 3;
  string provider = 4;
}

message AuthResponse {
  string accessToken = 1;
  bool isNewUser = 2;
  bool isOnboarded = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  UserResponse user = 2;
}

// Subscription messages
message Plan {
  string id = 1;
  string key = 2;             // 'free' | 'pro' | 'lab'
  string name = 3;            // 'Free Plan' | 'Pro Plan' | 'Lab Plan'
  int32 level = 4;            // 0: Free, 1: Pro, 2: Lab
  double price_monthly_lkr = 5;
  double price_annual_lkr = 6;
  repeated string feature_keys = 7;
  string duration = 8;        // 'monthly' | 'annual' | 'lifetime'
  bool is_active = 9;
}

message Subscription {
  string id = 1;
  string user_id = 2;
  string plan_id = 3;
  string plan_key = 4;
  string status = 5;          // 'active' | 'inactive' | 'expired' | 'cancelled' | 'trial'
  google.protobuf.Timestamp start_date = 6;
  google.protobuf.Timestamp end_date = 7;
  bool is_trial = 8;
  string payment_method = 9;  // 'payhere' | 'manual' | 'trial' | 'free'
}

message CreateSubscriptionRequest {
  string user_id = 1;
  string plan_key = 2;        // 'pro' | 'lab'
  string payment_method = 3;
}

message CreateSubscriptionResponse {
  bool success = 1;
  string message = 2;
  Subscription subscription = 3;
}

message GetSubscriptionRequest {
  string user_id = 1;
}

message GetSubscriptionResponse {
  bool success = 1;
  string message = 2;
  Subscription subscription = 3;
}

message GetPlansRequest {}

message GetPlansResponse {
  bool success = 1;
  repeated Plan plans = 2;
}

message GetPlanRequest {
  string plan_key = 1;
}

message GetPlanResponse {
  bool success = 1;
  Plan plan = 2;
}

message UpdateSubscriptionRequest {
  string user_id = 1;
  string plan_key = 2;
}

message UpdateSubscriptionResponse {
  bool success = 1;
  string message = 2;
  Subscription subscription = 3;
}

// Feature-based access check
message CheckFeatureAccessRequest {
  string user_id = 1;
  string feature_key = 2;
  string user_role = 3;
}

message CheckFeatureAccessResponse {
  bool has_access = 1;
  string reason = 2;          // 'allowed' | 'role_not_allowed' | 'plan_required'
  repeated string required_plans = 3;
}

// PayHere payment messages
message PayHereCheckoutRequest {
  string user_id = 1;
  string plan_key = 2;
  string billing_cycle = 3;   // 'monthly' | 'annual'
}

message PayHereCheckoutResponse {
  string merchant_id = 1;
  string order_id = 2;
  string hash = 3;
  double amount = 4;
  string currency = 5;
  string items = 6;
  string notify_url = 7;
  string return_url = 8;
  string cancel_url = 9;
}

message PayHereNotificationRequest {
  string merchant_id = 1;
  string order_id = 2;
  string payment_id = 3;
  string payhere_amount = 4;
  string payhere_currency = 5;
  string status_code = 6;
  string md5sig = 7;
}

message PayHereNotificationResponse {
  bool success = 1;
  string message = 2;
}

// Admin Plan CRUD messages
message CreatePlanRequest {
  string key = 1;
  string name = 2;
  int32 level = 3;
  double price_monthly_lkr = 4;
  double price_annual_lkr = 5;
  repeated string feature_keys = 6;
  string duration = 7;
}

message CreatePlanResponse {
  bool success = 1;
  string message = 2;
  Plan plan = 3;
}

message UpdatePlanRequest {
  string key = 1;
  string name = 2;
  int32 level = 3;
  double price_monthly_lkr = 4;
  double price_annual_lkr = 5;
  repeated string feature_keys = 6;
  string duration = 7;
  bool is_active = 8;
}

message UpdatePlanResponse {
  bool success = 1;
  string message = 2;
  Plan plan = 3;
}

message DeletePlanRequest {
  string key = 1;
}

message DeletePlanResponse {
  bool success = 1;
  string message = 2;
}

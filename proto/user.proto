// Updated user.proto
syntax = "proto3";
package user;
import "google/protobuf/timestamp.proto";

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc GetAllUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc GetUserById(GetUserByIdRequest) returns (GetUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc UpdatePersonalDetails(UpdatePersonalDetailsRequest) returns (UpdateProfileResponse);
  rpc VerifyUser(VerifyUserRequest) returns (VerifyUserResponse);
  
  // Onboarding RPCs
  rpc OnboardLandOwner(OnboardLandOwnerRequest) returns (OnboardResponse);
  rpc OnboardServiceProvider(OnboardServiceProviderRequest) returns (OnboardResponse);
  rpc OnboardLaboratory(OnboardLaboratoryRequest) returns (OnboardResponse);

  rpc GetPersonalDetails(GetUserByIdRequest) returns (PersonalDetailsResponse);
}

message CreateUserRequest {
  string email = 1;
  string password = 2;
  string name = 3;
  string role = 4;
}


message ListUsersRequest {
  int32 page = 1;       // Page number (1-based)
  int32 limit = 2;  // Number of users per page (max 100)
}

// Response message for listing users
message ListUsersResponse {
  repeated UserWithDetails users = 1;  // List of users with role details
  int32 total = 2;                     // Total number of users (for pagination metadata)
}

message UserWithDetails {
  User user = 1;
  LandOwnerDetails landOwnerDetails = 2;
  ServiceProviderDetails serviceProviderDetails = 3;
  LaboratoryDetails laboratoryDetails = 4;
  DistributorDetails distributorDetails = 5;
}


message CreateUserResponse {
  int32 status = 1;
  string message = 2;
  string id = 3;
}

message GetUserRequest {
  string email = 1;
}

message GetUserByIdRequest {
  string id = 1;
}

message GetUserResponse {
  int32 status = 1;
  string message = 2;
  User data = 3;
  LandOwnerDetails landOwnerDetails = 4;
  ServiceProviderDetails serviceProviderDetails = 5;
  LaboratoryDetails laboratoryDetails = 6;
  DistributorDetails distributorDetails = 7;
}

message UpdateUserRequest {
  string userId = 1;
  string name = 2;
  bool isOnboard = 3;
  string plan = 4;
  bool isSubscribe = 5;
  bool isVerified = 6;
}

message UpdateUserResponse {
  int32 status = 1;
  string message = 2;
  string name = 3;
  bool isOnboarded = 4;
  string plan = 5;
  bool isSubscribed = 6;
  bool isVerified = 7;
}

message DeleteUserRequest {
  string email = 1;
}

message DeleteUserResponse {
  int32 status = 1;
  string message = 2;
}

message UpdateProfileRequest {
  string userId = 1;
  repeated string docUrls = 2;
  int32 totalBeds = 3;
  string nic = 4;
  string laboratoryName = 5;
  string registrationNumber = 6;
  string address = 7;
  string companyName = 8;
}

message UpdateProfileResponse {
  int32 status = 1;
  string message = 2;
  User data = 3;
  LandOwnerDetails landOwnerDetails = 4;
  ServiceProviderDetails serviceProviderDetails = 5;
  LaboratoryDetails laboratoryDetails = 6;
  DistributorDetails distributorDetails = 7;
}

// New messages for personal details and account settings
message UpdatePersonalDetailsRequest {
  string userId = 1;
  repeated string docUrls = 2;
  int32 totalBeds = 3;
  string nic = 4;
  string laboratoryName = 5;
  string registrationNumber = 6;
  string address = 7;
  string companyName = 8;
}

message VerifyUserRequest {
  string userId = 1;
}

message VerifyUserResponse {
  int32 status = 1;
  string message = 2;
  User data = 3;
}

message UpdateAccountSettingsRequest {
  string user_id = 1;
  string email = 2;
  bool two_factor_enabled = 3;
  map<string, bool> linked_accounts = 4; // e.g., { "google": true, "facebook": false }
  bool profile_visibility = 5;
}

message DeactivateAccountRequest {
  string user_id = 1;
}

message DeleteAccountRequest {
  string user_id = 1;
}

// Single User message definition (extended with new fields)
message User {
  string id = 1;
  string email = 2;
  string phone = 3;
  string role = 4;
  bool isOnboarded = 5;
  string plan = 6;
  bool isSubscribed = 7;
  bool isVerified = 8;
}

message OnboardLandOwnerRequest {
  string userId = 1;
  repeated string docUrls = 2;
  int32 totalBeds = 3;
  string nic = 4;
  string address = 5;
}

message OnboardServiceProviderRequest {
  string userId = 1;
  repeated string docUrls = 2;
  string companyName = 3;
  string registrationNumber = 4;
  string address = 5;
}

message OnboardLaboratoryRequest {
  string userId = 1;
  repeated string docUrls = 2;
  string laboratoryName = 3;
  string registrationNumber = 4;
  string address = 5;
}

message OnboardResponse {
  bool success = 1;
  string message = 2;
}

message PersonalDetailsResponse {
  User user = 1;
  LandOwnerDetails landOwnerDetails = 2;
  ServiceProviderDetails serviceProviderDetails = 3;
  LaboratoryDetails laboratoryDetails = 4;
  DistributorDetails distributorDetails = 5;
}

message DistributorDetails {
  string id = 1;
  string userId = 2;
  repeated string docUrls = 3;
  string companyName = 4;
  string registrationNumber = 5;
  string address = 6;
}

message LandOwnerDetails {
  string id = 1;
  string userId = 2;
  repeated string docUrls = 3;
  int32 totalBeds = 4;
  string nic = 5;
  string address = 6;
}

message ServiceProviderDetails {
  string id = 1;
  string userId = 2;
  repeated string docUrls = 3;
  string companyName = 4;
  string registrationNumber = 5;
  string address = 6;
}

message LaboratoryDetails {
  string id = 1;
  string userId = 2;
  repeated string docUrls = 3;
  string laboratoryName = 4;
  string registrationNumber = 5;
  string address = 6;
}

// New messages for subscriptions
message CreateSubscriptionRequest {
  string user_id = 1;
  string plan = 2; // 'basic' or 'premium'
}

message CreateSubscriptionResponse {
  bool success = 1;
  string message = 2;
  string checkout_url = 3;
}

message GetSubscriptionRequest {
  string user_id = 1;
}

message GetSubscriptionResponse {
  bool success = 1;
  string message = 2;
  SubscriptionData data = 3;
}

message SubscriptionData {
  string id = 1;
  string plan = 2; // 'free', 'basic', 'premium'
  bool is_active = 3;
  google.protobuf.Timestamp end_date = 4;
  string stripe_subscription_id = 5;
}

message UpdateSubscriptionRequest {
  string user_id = 1;
  string plan = 2;
}

message UpdateSubscriptionResponse {
  bool success = 1;
  string message = 2;
  string checkout_url = 3;
}

message HandleStripeWebhookRequest {
  string event_type = 1; // e.g., 'checkout.session.completed'
  string data = 2; // JSON string of event data
}

message CheckSubscriptionAccessRequest {
  string user_id = 1;
  int32 required_level = 2; // 0=free, 1=basic, 2=premium
}

message CheckSubscriptionAccessResponse {
  bool has_access = 1;
}
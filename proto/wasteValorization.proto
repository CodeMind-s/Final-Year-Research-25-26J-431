syntax = "proto3";
package wasteval;

service WasteValorizationJobService {
  rpc CreateJob(CreateJobRequest) returns (CreateJobResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc GetJobs(GetJobsRequest) returns (GetJobsResponse);
  rpc UpdateJob(UpdateJobRequest) returns (UpdateJobResponse);
  rpc GetJobStatus(GetJobStatusRequest) returns (GetJobStatusResponse);
}

service WasteValorizationManagementService {
  rpc GetWastePredictions(GetWastePredictionsRequest) returns (GetWastePredictionsResponse);
  rpc QuickPrediction(QuickPredictionRequest) returns (QuickPredictionResponse);
  // Monthly aggregated time series for waste predictions
  rpc GetWasteMonthlyPredictions(GetWasteMonthlyPredictionsRequest) returns (GetWasteMonthlyPredictionsResponse);
  // Price estimates management
  rpc GetPriceEstimates(GetPriceEstimatesRequest) returns (GetPriceEstimatesResponse);
  rpc UpsertPriceEstimates(UpsertPriceEstimatesRequest) returns (UpsertPriceEstimatesResponse);
  // Prediction reports
  rpc GetPredictionReportSummary(GetPredictionReportSummaryRequest) returns (GetPredictionReportSummaryResponse);
  rpc GetPredictionReportDetailed(GetPredictionReportDetailedRequest) returns (GetPredictionReportDetailedResponse);
}

enum JobStatus {
  PENDING = 0;
  PROCESSING = 1;
  COMPLETED = 2;
  FAILED = 3;
}

enum JobType {
  WASTE_PREDICTION = 0;
  VALORIZATION_ANALYSIS = 1;
  OPTIMIZATION = 2;
}

message Job {
  string _id = 1;
  string userId = 2;
  JobType jobType = 3;
  JobStatus status = 4;
  string predictionDate = 5; // ISO date string (YYYY-MM-DD)
  string requestData = 6;    // JSON string of input data
  string resultData = 7;     // JSON string of result data
  string errorMessage = 8;
  string createdAt = 9;
  string updatedAt = 10;
}

message CreateJobRequest {
  string userId = 1;
  JobType jobType = 2;
  string predictionDate = 3; // ISO date string (YYYY-MM-DD)
  string requestData = 4;
}

message CreateJobResponse {
  bool success = 1;
  string message = 2;
  Job data = 3;
}

message GetJobRequest {
  string id = 1;
}

message GetJobResponse {
  bool success = 1;
  string message = 2;
  Job data = 3;
}

message GetJobsRequest {
  string userId = 1;
  JobStatus status = 2;
  JobType jobType = 3;
  int32 page = 4;
  int32 limit = 5;
}

message GetJobsResponse {
  bool success = 1;
  string message = 2;
  repeated Job data = 3;
  int32 total = 4;
  int32 page = 5;
  int32 limit = 6;
}

message UpdateJobRequest {
  string id = 1;
  JobStatus status = 2;
  string predictionDate = 3; // ISO date string (YYYY-MM-DD)
  string resultData = 4;
  string errorMessage = 5;
}

message UpdateJobResponse {
  bool success = 1;
  string message = 2;
  Job data = 3;
}

message GetJobStatusRequest {
  string id = 1;
}

message GetJobStatusResponse {
  bool success = 1;
  string message = 2;
  string jobId = 3;
  JobStatus status = 4;
  string resultData = 5;
  string errorMessage = 6;
}

// Waste Management Dashboard messages
message GetWastePredictionsRequest {
  string startDate = 1;  // ISO date string (YYYY-MM-DD)
  string endDate = 2;    // ISO date string (YYYY-MM-DD)
  bool includeAverages = 3;
  string userId = 4;     // Optional user ID for filtering
}

message GetWastePredictionsResponse {
  bool success = 1;
  string data = 2;       // JSON stringified predictions data
  string timestamp = 3;
  string message = 4;
}

// Quick Prediction messages
message QuickPredictionRequest {
  double production_volume = 1;
  double rain_sum = 2;
  double temperature_mean = 3;
  double humidity_mean = 4;
  double wind_speed_mean = 5;
}

message QuickPredictionResponse {
  bool success = 1;
  string data = 2;       // JSON stringified prediction data
  string timestamp = 3;
  string message = 4;
}

message GetWasteMonthlyPredictionsRequest {
  string startDate = 1;  // ISO date string (YYYY-MM-DD)
  string endDate = 2;    // ISO date string (YYYY-MM-DD)
  bool includeAverages = 3;
  string userId = 4;     // Optional user ID for filtering
}

message GetWasteMonthlyPredictionsResponse {
  bool success = 1;
  string data = 2;       // JSON stringified monthly predictions data
  string timestamp = 3;
  string message = 4;
}

message GetPriceEstimatesRequest {
  string siteId = 1;
}

message GetPriceEstimatesResponse {
  bool success = 1;
  string data = 2; // JSON stringified price object
  string timestamp = 3;
  string message = 4;
}

message UpsertPriceEstimatesRequest {
  string siteId = 1;
  string userId = 2;
  double epsom_salt = 3;
  double potash = 4;
  double magnesium_oil = 5;
  double gypsum = 6;
  double limestone = 7;
  double industrial_salt = 8;
  string currency = 9;
}

message UpsertPriceEstimatesResponse {
  bool success = 1;
  string data = 2; // JSON stringified price object
  string timestamp = 3;
  string message = 4;
}

message GetPredictionReportSummaryRequest {
  string siteId = 1;
  string startMonth = 2; // YYYY-MM
  string endMonth = 3; // YYYY-MM
  string currency = 4; // optional
}

message PredictionByProduct {
  string product = 1;
  double qty = 2;
  double income = 3;
  double unit_price = 4;
}

message GetPredictionReportSummaryResponse {
  bool success = 1;
  string data = 2; // JSON stringified summary
  string timestamp = 3;
  string message = 4;
}

message GetPredictionReportDetailedRequest {
  string siteId = 1;
  string startMonth = 2; // YYYY-MM
  string endMonth = 3; // YYYY-MM
  string currency = 4; // optional
  string format = 5; // json/csv/pdf
}

message GetPredictionReportDetailedResponse {
  bool success = 1;
  string data = 2; // JSON stringified detailed report
  string timestamp = 3;
  string message = 4;
}


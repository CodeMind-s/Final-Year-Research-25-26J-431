name: Vision Service CI

on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'apps/vision-service/**'
      - 'apps/api-gateway/src/app/vision-service/**'
      - 'proto/vision.proto'
      - 'packages/**'
      - 'types/**'
      - '.github/workflows/vision-service-ci.yml'
  pull_request:
    paths:
      - 'apps/vision-service/**'
      - 'apps/api-gateway/src/app/vision-service/**'
      - 'proto/vision.proto'
      - 'packages/**'
      - 'types/**'
      - '.github/workflows/vision-service-ci.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run ESLint
        run: npx eslint apps/vision-service/src --ext .ts --max-warnings 0 || true
        continue-on-error: true

      - name: Run unit tests
        run: npx jest --config apps/vision-service/jest.config.js --ci --passWithNoTests
        env:
          CI: true
          # E2E tests are skipped in CI by default (requires MongoDB connection)
          # To run e2e tests, set MONGO_URI in GitHub secrets

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            apps/vision-service/test-output
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build vision-service
        run: npx nx build vision-service --skip-nx-cache
        env:
          NX_NO_CLOUD: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vision-service-dist
          path: apps/vision-service/dist
          retention-days: 7
          if-no-files-found: ignore

  performance:
    name: Performance Tests (k6)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[perf]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D68
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build services
        run: |
          npx nx build api-gateway --skip-nx-cache
          npx nx build vision-service --skip-nx-cache
        env:
          NX_NO_CLOUD: true

      - name: Run k6 smoke test (REST endpoints)
        run: |
          k6 run apps/vision-service/tests/performance/k6/rest-endpoints.js \
            --env LOAD_PROFILE=smoke \
            --env API_BASE_URL=http://localhost:3400/api/v1 \
            --summary-export apps/vision-service/test-output/performance/k6-rest-summary.json \
            || true
        env:
          K6_NO_USAGE_REPORT: true

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: |
            apps/vision-service/test-output/performance/k6-*.json
          retention-days: 14
          if-no-files-found: ignore

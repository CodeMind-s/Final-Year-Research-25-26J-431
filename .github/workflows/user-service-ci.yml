name: User Service CI

on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'apps/user-service/**'
      - 'packages/**'
      - 'types/**'
      - '.github/workflows/user-service-ci.yml'
  pull_request:
    paths:
      - 'apps/user-service/**'
      - 'packages/**'
      - 'types/**'
      - '.github/workflows/user-service-ci.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npx eslint apps/user-service/src --ext .ts --max-warnings 0 || true
        continue-on-error: true

      - name: Run unit tests
        run: npx jest --config apps/user-service/jest.config.js --ci --passWithNoTests
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            apps/user-service/test-output
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build user-service
        run: npx nx build user-service

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: user-service-dist
          path: apps/user-service/dist
          retention-days: 7
          if-no-files-found: ignore
